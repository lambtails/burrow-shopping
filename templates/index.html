<!doctype html>
<html>

<head>
    <title>Burrow shopping</title>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, user-scalable=yes"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <div class="grid"> {% for row in data %} <label
            class="item"
            for="item-{{row['rowid']}}"
            style="{% if row['colour']|length != 0 %}--icon-color: {{row['colour']}};{% endif %}"
        >
            <input
                type="checkbox"
                id="item-{{row['rowid']}}"
                autocomplete="off"
                {% if row['done'] %}checked{% endif %}
            />
            {% if row['icon']|length != 0 %}<img class="icon"
                src="{{ url_for('static', filename='icon/'+row['icon']) }}">{% endif %}
            {% if row['category'] == 'freezer' %}
            <div class="modifier-right"><img src="{{ url_for('static', filename='icon/ice.png') }}"></div>
            {% elif row['category'] == 'canned' %}
            <div class="modifier-right"><img src="{{ url_for('static', filename='icon/can.png') }}"></div>
            {% endif %}
            <span>{{row['groceryname']}}</span>
        </label> {% endfor %} {% if data|length == 0 %}<p id="no-groceries-found">No groceries found</p>{% endif %}
    </div>
    <script src="{{ url_for('static', filename='burrow-shopping.js') }}"></script>
</body>

</html>
